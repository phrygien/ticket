version: "3.9"

networks:
  traefik-public:
    external: true
  cosm-ia-net:
    external: true   # docker network create cosm-ia-net

services:
  cosm-ia-mysql:
    image: mysql:8
    container_name: cosm-ia-mysql
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - cosm-ia-mysql-data:/var/lib/mysql
    networks:
      - cosm-ia-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cosm-ia-app:
    build: .
    container_name: cosmia-app
    restart: unless-stopped
    depends_on:
      cosm-ia-mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=cosmia-mysql
      - DB_PORT=3306
    volumes:
      - cosm-ia-storage:/var/www/html/storage
    networks:
      - cosm-ia-net
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.cosm-ia.rule=Host(`cosmia.astucom.com`)
      - traefik.http.routers.cosm-ia.entrypoints=websecure
      - traefik.http.routers.cosm-ia.tls.certresolver=letsencrypt
      - traefik.http.services.cosm-ia.loadbalancer.server.port=80

volumes:
  cosm-ia-mysql-data:
  cosm-ia-storage:
