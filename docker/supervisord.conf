[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
priority=5

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10

[program:laravel-queue]
command=php /var/www/html/artisan queue:work --tries=3 --sleep=3
autostart=true
autorestart=true
numprocs=1
priority=15
